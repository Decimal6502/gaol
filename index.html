<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaol Tactician</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./styles/app.css">
</head>

<body>
    <div class="tabs">
        <div class="tab active" onclick="switchTab('board')" data-i18n="tab.plan">編成</div>
        <div class="tab" onclick="switchTab('settings')" data-i18n="tab.members">メンバー</div>
        <div class="tab" onclick="switchTab('diagnostics')" data-i18n="tab.diagnostics">診断</div>
    </div>

    <div id="settings" class="content">
        <h3 data-i18n="members.title">メンバー登録</h3>
        <label class="language-setting">
            <span data-i18n="settings.language">言語</span>
            <select id="language-select" onchange="changeLanguage(this.value)">
                <option value="auto" data-i18n="settings.languageAuto">自動</option>
                <option value="ja" data-i18n="settings.languageJa">日本語</option>
                <option value="en" data-i18n="settings.languageEn">English</option>
            </select>
        </label>
        <div class="availability-legend">
            <div class="legend-item">
                <strong class="legend-mark mark-main">★</strong>
                <span class="legend-label" data-i18n="availability.main">上級マスター</span>
                <span class="legend-description" data-i18n="availability.mainDescription">パーティの核となるメイン戦力</span>
            </div>
            <div class="legend-item">
                <strong class="legend-mark mark-ok">☆</strong>
                <span class="legend-label" data-i18n="availability.ok">初級マスター</span>
                <span class="legend-description" data-i18n="availability.okDescription">状況に応じて活躍できるサブ戦力</span>
            </div>
            <div class="legend-item">
                <strong class="legend-mark mark-fill">○</strong>
                <span class="legend-label" data-i18n="availability.fill">Lv99</span>
                <span class="legend-description" data-i18n="availability.fillDescription">数合わせ要員ジョブ</span>
            </div>
            <div class="legend-item">
                <strong class="legend-mark mark-none">-</strong>
                <span class="legend-label" data-i18n="availability.ng">不可</span>
                <span class="legend-description" data-i18n="availability.ngDescription">出場不可(Lv99未満)</span>
            </div>
        </div>
        <div id="settings-list"></div>
        <button class="btn-action btn-add" onclick="addMemberRow()" data-i18n="members.addDisplayName">メンバーを追加</button>
    </div>

    <div id="board" class="content active">
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <button class="btn-action btn-auto" style="flex:1; margin-bottom:0;" onclick="autoFillBoard()">🎲
                <span data-i18n="plan.autoFill">残りを適当に埋める</span></button>
            <button class="btn-action" style="background:var(--danger); width:80px;" onclick="resetBoardJobs()">🗑️
                <span data-i18n="common.reset">リセット</span></button>
        </div>

        <div class="boss-header">
            <div style="padding-top:5px; font-weight:bold; color:#666;" data-i18n="plan.memberHeader">MEMBER</div>
            <div class="battle-column-head"><span>1</span><select class="boss-select" id="boss-1" onchange="saveBoardState()"></select><div class="boss-weak-label" id="boss-1-weak"></div></div>
            <div class="battle-column-head"><span>2</span><select class="boss-select" id="boss-2" onchange="saveBoardState()"></select><div class="boss-weak-label" id="boss-2-weak"></div></div>
            <div class="battle-column-head"><span>3</span><select class="boss-select" id="boss-3" onchange="saveBoardState()"></select><div class="boss-weak-label" id="boss-3-weak"></div></div>
            <div class="battle-column-head bonus-column-head"><span data-i18n="plan.bonusAmp">ボーナス(アンプ)</span><select class="boss-select" id="boss-bonus" onchange="saveBoardState()"></select><div class="boss-weak-label" id="boss-bonus-weak"></div></div>
        </div>
        <div id="battle-grid"></div>

        <section class="export-panel" aria-label="共有用プレビュー" data-i18n-attr="aria-label:share.previewAria">
            <div class="export-header">
                <div>
                    <h3 data-i18n="share.previewTitle">共有プレビュー</h3>
                    <p data-i18n="share.previewDescription">現在の編成だけを匿名ラベルで出力します。</p>
                </div>
                <label class="name-toggle">
                    <input type="checkbox" id="share-name-toggle" onchange="handleShareNameToggle()">
                    <span data-i18n="share.includeDisplayNames">表示名を含める</span>
                </label>
            </div>

            <div class="export-actions">
                <button class="btn-action btn-copy-text" onclick="copyShareText()" data-i18n="share.copyText">テキストをコピー</button>
                <button class="btn-action btn-download" onclick="downloadPlanPng()" data-i18n="share.savePng">PNGを保存</button>
                <button class="btn-action btn-backup" onclick="exportJsonBackup()" data-i18n="backup.saveJson">JSON保存</button>
                <label class="btn-action btn-import">
                    <span data-i18n="backup.loadJson">JSON読込</span>
                    <input type="file" id="json-import-input" accept="application/json,.json" onchange="importJsonBackup(event)">
                </label>
            </div>

            <textarea id="share-text-preview" class="share-text-preview" readonly aria-label="テキストプレビュー" data-i18n-attr="aria-label:share.textPreview"></textarea>
            <div class="image-preview-frame">
                <canvas id="share-image-preview" width="900" height="620" aria-label="PNGプレビュー" data-i18n-attr="aria-label:share.pngPreview"></canvas>
            </div>
            <div id="share-feedback" class="share-feedback" aria-live="polite"></div>
        </section>

        <div style="height: 50px;"></div>
    </div>

    <div id="diagnostics" class="content">
        <div class="panel-heading">
            <div>
                <h3 data-i18n="diagnostics.panelTitle">診断パネル</h3>
                <p data-i18n="diagnostics.panelDescription">現在のデータと実装状態を確認します。</p>
            </div>
            <button class="btn-action btn-secondary" onclick="renderDiagnostics()" data-i18n="common.refresh">更新</button>
        </div>
        <div class="diagnostics-notice">
            <strong data-i18n="diagnostics.noticeTitle">外部連携について</strong>
            <p data-i18n="diagnostics.noticeBody">このアプリは手入力用の外部メモツールです。FFXIクライアント、PlayOnline、Windower、Ashitaとは連携せず、ゲームデータの取得・解析・自動操作は行いません。</p>
        </div>
        <div id="diagnostics-summary" class="diagnostics-summary"></div>
        <div id="diagnostics-list" class="diagnostics-list"></div>
    </div>

    <div class="deck-container">
        <div class="deck-info" id="deck-message" data-i18n="deck.selectJob">ジョブを選択してください</div>
        <div class="deck-grid" id="deck-grid"></div>
    </div>
    <script src="./src/app.js"></script>
    <script src="./src/share-view.js"></script>
    <script src="./src/text-export.js"></script>
    <script src="./src/image-export.js"></script>
    <script src="./src/backup.js"></script>
    <script src="./src/diagnostics.js"></script>
</body>

</html>
